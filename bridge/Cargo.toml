[package]
name = "pluto-viz"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "JACK bridge for the Pluto tholin-snow visualiser: level and band levels over WebSocket, serves the page"

[dependencies]
rtrb = "0.4"
tungstenite = "0.26"
tiny_http = "0.12"

# Linux: JACK (PipeWire's JACK included). Windows / macOS: the system audio API via cpal.
[target.'cfg(target_os = "linux")'.dependencies]
jack = "0.13"

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18"

[profile.release]
opt-level = 3
