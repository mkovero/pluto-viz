[package]
name = "pluto-viz"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "JACK bridge for the Pluto tholin-snow visualiser: level and band levels over WebSocket, serves the page"

[dependencies]
rtrb = "0.4"
tungstenite = "0.26"
tiny_http = "0.12"

# Linux: PipeWire through cpal, or JACK (loaded at run time). Windows / macOS: the system
# audio API through cpal.
[target.'cfg(target_os = "linux")'.dependencies]
jack = "0.13"
cpal = { version = "0.18", features = ["pipewire"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
cpal = "0.18"

[profile.release]
opt-level = 3
