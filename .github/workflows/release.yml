name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, name: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: JACK headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libjack-jackd2-dev
      - name: Build
        working-directory: bridge
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          dir=pluto-viz-$TAG-${{ matrix.name }}
          mkdir "$dir"
          exe=pluto-viz
          [ "$RUNNER_OS" = Windows ] && exe=pluto-viz.exe
          cp "bridge/target/${{ matrix.target }}/release/$exe" README.md LICENSE "$dir/"
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$dir.zip" "$dir" >/dev/null
            echo "ASSET=$dir.zip" >> "$GITHUB_ENV"
          else
            tar czf "$dir.tar.gz" "$dir"
            echo "ASSET=$dir.tar.gz" >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "pluto-viz $TAG" --generate-notes \
            || gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
